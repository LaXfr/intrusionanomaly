version = "1.0.2"
random_seed = 42

[dataset]
parquet_directory = "data/processed/CIC-IDS2017-phase04-v2/cleaned/extracted/MachineLearningCVE"
feature_schema = "configs/feature_schema.json"

[split]
train = ["Monday", "Tuesday", "Wednesday"]
validation = ["Thursday"]
test = ["Friday"]

[training]
maximum_rows = 80000
batch_size = 20000
preprocessing_profile = "linear"
feature_selection = false
solver = "lbfgs"
penalty = "l2"
C = 1.0
max_iter = 2000
tol = 0.0001
class_weight = "balanced"
decision_threshold = 0.5

[threshold_sensitivity]
validation_thresholds = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

[artifacts]
directory = "models/supervised/binary"
model_family = "logistic_regression"
version = "1.0.2"

[reports]
directory = "reports/evaluation/binary_logistic"

[comparison]
random_forest_report = "reports/evaluation/binary/20261103T160232Z/binary_experiment.json"
random_forest_artifact = "models/supervised/binary/random_forest/1.0.1"
