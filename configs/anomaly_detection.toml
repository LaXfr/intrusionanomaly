version = "1.0"
random_seed = 42

[dataset]
parquet_directory = "data/processed/CIC-IDS2017-phase04-v2/cleaned/extracted/MachineLearningCVE"
feature_schema = "configs/feature_schema.json"
preprocessing_config = "configs/preprocessing.toml"
benign_label = "BENIGN"

[split]
strategy = "capture_day_holdout"
train_days = ["Monday", "Tuesday", "Wednesday"]
validation_days = ["Thursday"]
test_days = ["Friday"]
random_seed = 42

[training]
max_benign_training_rows = 150000
batch_size = 20000
minimum_benign_training_rows = 100
minimum_benign_validation_rows = 100

[model.isolation_forest]
n_estimators = 200
max_samples = 4096
max_features = 1.0
contamination = "auto"
bootstrap = false
random_state = 42
n_jobs = 4

[calibration]
quantile_method = "higher"
default_operating_point = "target-fpr-1pct"
operating_points = [
  { id = "target-fpr-0_5pct", target_fpr = 0.005 },
  { id = "target-fpr-1pct", target_fpr = 0.01 },
  { id = "target-fpr-2pct", target_fpr = 0.02 },
  { id = "target-fpr-5pct", target_fpr = 0.05 },
  { id = "target-fpr-10pct", target_fpr = 0.10 },
]

[artifacts]
model_directory = "models/unsupervised/isolation_forest"
preprocessor_directory = "models/unsupervised/preprocessing"
model_version = "1.0.0"
preprocessor_version = "1.0.0"

[reports]
evaluation_directory = "reports/evaluation/anomaly_detection"
figure_directory = "reports/figures/anomaly_detection"
experiment_directory = "reports/experiments/anomaly_detection"
error_feature_sample_rows = 5000
